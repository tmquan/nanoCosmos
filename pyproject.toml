[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocosmos"
version = "0.1.0"
description = "A modular PyTorch Lightning infrastructure for connectomics research."
readme = "README.md"
license = {text = "MIT"}
# The runnable env is Python 3.13 / CUDA 13.2 / Rubin sm_107.  The exact
# pins, including the torch 2.14 cu132 nightly, live in requirements.txt.
requires-python = ">=3.12"
# Core runtime dependencies.  These are the imports actually exercised
# by ``import nanocosmos`` and by the standard training / inference path.
# Optional features (Cosmos backbone, GPU acceleration, the JS
# visualizer, download scripts) live in ``[project.optional-dependencies]``
# below so a vanilla install stays slim.
dependencies = [
    "torch>=2.1.0",
    "pytorch-lightning>=2.1.0",
    "monai>=1.3.0",
    "einops>=0.7.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "h5py>=3.9.0",
    "tifffile>=2023.7.0",
    "pynrrd>=1.0.0",
    "nibabel>=5.0.0",
    # NumPy 2.x ABI: the cu13 torch and cupy-cuda13x wheels this project
    # targets are built against NumPy 2.x; a 1.x resolution triggers the
    # "module compiled against NumPy 2.x ... cannot run in NumPy 1.x" crash.
    "numpy>=2.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "scikit-image>=0.21.0",  # CPU fallback for transforms.label / find_boundaries
    "tqdm>=4.65.0",          # sliding-window progress bar (lazily imported)
    "wandb>=0.15.0",
    "tensorboard>=2.14.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Cosmos backbones (Cosmos 2.5 Predict + Cosmos 3 Nano).
# Pulls HuggingFace + diffusers (+ transformers for the Cosmos 3 omni
# Qwen3-VL / Qwen2 sub-towers).
#
# Cosmos3-Edge needs the diffusers commit that reads ``hidden_act: relu2``
# and ``qk_norm_for_text: false``.  A PyPI 0.39 install builds a gated-SiLU
# MLP the Edge checkpoint does not contain.  Same commit as requirements.txt.
cosmos = [
    "diffusers @ git+https://github.com/huggingface/diffusers.git@9f6fc2c13610ead670cbac6dbf974b2a24a9e69b",
    # transformers and accelerate are not imported directly by the
    # package; they are load-bearing transitively via diffusers (the
    # Cosmos 3 omni Qwen3-VL / Qwen2 sub-towers).  Keep declared.
    "transformers>=4.57.0",
    "huggingface_hub>=1.6.0",
    # git-main diffusers requires safetensors>=0.8.0rc0.
    "safetensors>=0.8.0rc0",
    "accelerate>=1.13.0",
]
# cupy wheels for the GPU Mutex Watershed (``mws_cp``) + DLPack interop
# and cupy/cucim-backed transforms (EDT / gaussian / connected
# components; optional, scipy/skimage CPU fallback).
# Must be installed via NVIDIA's index, e.g.:
#   pip install -e ".[gpu-cu13]" --extra-index-url https://pypi.nvidia.com
gpu-cu13 = [
    "cupy-cuda13x>=14.0",
]
gpu-cu12 = [
    "cupy-cuda12x>=13.0",
]
# Download helpers in ``scripts/download_*.py``.
# NOTE: ``requests`` removed -- the download scripts use stdlib
# urllib.request; non-HTTP fetches go through cloud-volume (which pulls
# its own requests transitively).  requests was not imported directly.
scripts = [
    "cloud-volume>=10.4.0",
]
# Optional viewer (``nanocosmos.visualizer``) -- a FastAPI + WebGL QA
# viewer (app.py imports fastapi/pydantic, __main__.py imports uvicorn).
# ``plotly`` removed: it is not imported anywhere in the codebase.
viz = [
    "pillow>=10.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
]
# Doc-figure generators (``doc/figures/*.py``, ``doc/assets/*.py``).
# matplotlib is used only by these scripts, not by ``import nanocosmos``
# or the training / inference path, so it is out of core ``dependencies``.
figures = [
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
include = ["nanocosmos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
