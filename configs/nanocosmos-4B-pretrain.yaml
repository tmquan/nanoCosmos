    imaging: FIB-SEM
  # mitoem2_stem_test01 REMOVED: audited autocorr median 0.45 (only 24% of
  # probes reach the 0.5 gate threshold); consistent with both stem TRAIN
  # volumes above being removed for the same reason -- no cloud source to
  # replace it with, and no train counterpart left to pair it with anyway.

model:
  type: joint3d_edge     # -> JointEdge3DModule (Cosmos3-Edge ~4B backbone, direct-loaded, + Joint3DReconSegLoss)
  variant: EDGE
  in_channels: 1
  head_channels: 32            # len(loss.seg.offsets)=30 + sem + raw
  feature_size: 64
  dropout: 0.0                 # no dropout anywhere in the Cosmos3 model (matches 16B)
  pretrained: true
  dtype: bf16                  # weight dtype; paired with training.precision bf16-true
  # VAE encoder stays frozen.  VAE decoder stays frozen except its last
  # up-block and output norm (kept trainable by ``_freeze_body`` in
  # ``nanocosmos/models/cosmos_2_5_common/decoder.py``).  The AR reasoner
  # stays frozen (embed_tokens, AR MLP, AR norms, lm_head, and the AR half
  # of packed attention).  ``freeze_dit_backbone: false`` trains the DiT
  # generation half from epoch 0.  An integer N would freeze the whole DiT
  # for epochs 0..N-1 and then thaw it, still holding the reasoner out.
  # The EM feature projector and task head train at optimizer.lr.
  freeze_vae_encoder: true
  freeze_vae_decoder: true
  freeze_dit_backbone: false
  freeze_understanding_stream: true
  # Redundant while freeze_understanding_stream is true (that freeze already
  # covers mlp.*).  Left on so the AR MLP cannot train if the stream flag
  # is turned off by itself.
  freeze_understanding_ffn: true
  # Packed attention (self_attn) is joint only in the softmax: DiT queries
  # attend to cat(AR keys/values, DiT keys/values).  There is no shared
  # projection.  The AR half (to_q/k/v/out, norm_q/k) stays frozen with the
  # reasoner.  The DiT half (add_q/k/v_proj, to_add_out, norm_added_q/k)
  # TRAINS.  That is the EM loss path, and proj_in was repatched from
  # latent patch 2 to 1, so the video attention must adapt to the 4 nm grid.
  # Freezing the DiT half would pin natural-video attention on EM tokens.
  # Recompute the DiT and the Wan decoder body.  The body is on the loss
  # path (DiT features -> to_latent -> decoder body -> task head).  The
  # frozen original conv_out is only the TensorBoard pred/wan_decoder
  # diagnostic.  Checkpointing is incompatible with torch.compile tracing
  # the checkpoint HOP.
  gradient_checkpointing: 
  - dit
  - decode
  vae_input_pm1: true
  vae_symmetrize_z: false  # non-causal z: avg(forward, z-flipped) encode and decoder body

optimizer:
  lr: 0.0002
  weight_decay: 0.0001
  betas: [0.9, 0.99]
  scheduler:
    type: cosine_warmup
    T_max: 101
    eta_min: 6.0e-05
    warmup_epochs: 0
  dit_backbone_lr: 1.0e-04

# Joint3DReconSegLoss, reconstruction only.  ``weight_seg`` is 0 because this
# pretrain draws no sft batches.  The nested ``seg`` block is kept so the
# head stays 32 channels (30 offsets + sem + raw), identical to
# nanocosmos-4B.yaml -- required if this checkpoint is later continued into
# the joint recipe.  ``weight_raw`` of the inner loss is forced to 0; the EM
# term is owned by ``weight_rec``.
loss:
  type: joint3d
  recon_loss: l1
  weight_rec: 1.0
  weight_seg: 0.0          # no segmentation in this pretrain
  # SSL is the only branch drawn.  weight_ssl scales that recon step.
  weight_ssl: 5.0
  weight_sft: 0.0          # sft branch is not in data.branches
  seg:
    ignore_index: -100
    background: -1
    n_pull: 5
    offsets:
    - [-1, 0, 0]
    - [0, -1, 0]
    - [0, 0, -1]
    - [0, -1, -1]
    - [0, 1, -1]
    - [-2, 0, 0]
    - [-3, 0, 0]
    - [-4, 0, 0]
    - [-5, 0, 0]
    - [-8, 0, 0]
    - [0, -2, 0]
    - [0, 0, -2]
    - [0, -4, 0]
    - [0, 0, -4]
    - [0, -8, 0]
    - [0, 0, -8]
    - [0, -16, 0]
    - [0, 0, -16]
    - [0, -32, 0]
    - [0, 0, -32]
    - [0, -2, -2]
    - [0, 2, -2]
    - [0, -4, -4]
    - [0, 4, -4]
    - [0, -8, -8]
    - [0, 8, -8]
    - [0, -16, -16]
    - [0, 16, -16]
    - [0, -32, -32]
    - [0, 32, -32]
    weight_aff:
      weight: 1.0
      lambda_bce: 1.0
      lambda_dice: 1.0
      lambda_focal: 1.0
      gamma: 3.0
      pull_weight: 1.0
      push_weight: 3.0
      mask_to_foreground: true
      class_balance: auto
      class_balance_clip: 10.0
      dice_two_sided: true
    weight_sem:
      weight: 1.0
      lambda_bce: 1.0
      lambda_dice: 1.0
      lambda_focal: 1.0
      gamma: 3.0
      class_balance: auto
      class_balance_clip: 10.0
      dice_two_sided: true

training:
  # Agglomerator is constructed by the module but never run: ssl batches
  # have no labels.  Kept so the joint recipe can be restored unchanged.
  mutex_watershed:
    strides: [1, 1, 1]
    size_filter: 50
    backend: auto
    buckets: 16
    max_push_edges: null
    gate_with_sem: true
    sem_gate_threshold: 0.5
    grow_boundaries: false
    grow_max_distance: 0.0
  max_epochs: 101
  accelerator: auto
  devices: auto
  strategy: ddp
  # Joint datamodule uses a custom round-robin batch_sampler -> Lightning
  # cannot auto-inject a DistributedSampler; the sampler + random per-item
  # patch sampling handle per-rank data spread instead.
  use_distributed_sampler: false
  precision: bf16-true
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 1.0
  # Cap the (otherwise ~52k = 6.5 x num_samples) round-robin schedule to a sane
  # epoch length.  The shuffled schedule makes each epoch a task-weighted random
  # subset that rotates -- raise/lower to trade epoch length for checkpoint/val
  # frequency.
  limit_train_batches: 500
  limit_val_batches: 100
  check_val_every_n_epoch: 10
  num_sanity_val_steps: 2
  log_every_n_steps: 100
  enable_progress_bar: true
  enable_model_summary: true
  deterministic: false
  benchmark: true
  # Off: incompatible with gradient_checkpointing (dynamo can't trace the
  # torch.utils.checkpoint HOP), and reduce-overhead cudagraphs fragment memory.
  compile: false 
  compile_fullgraph: false 
  fast_dev_run: false
  profiler: null
  resume_from_checkpoint: null

callbacks:
  checkpoint:
    enabled: true
    dirpath: null
    filename: '{epoch:02d}-{val/automatic/loss:.4f}'
    save_top_k: 3
    monitor: val/automatic/loss
    mode: min
    save_last: true
    verbose: true
  early_stopping:
    enabled: false
  lr_monitor:
    enabled: true
  image_logger:
    enabled: true
    every_n_epochs: 1
    max_images: 8
    # Joint logger: orthogonal mid-planes (xy, xz, yz) of the source and the
    # recon target, on the 4 nm grid, including after sanity validation.
    # A coarser target is upsampled.
  cuda_empty_cache_before_val: true
  memory_logger:
    enabled: true
    log_every_n_steps: null

output_dir: ${oc.env:HOME}/outputs

hydra:
  job:
    chdir: false
