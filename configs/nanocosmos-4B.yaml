# =====================================================================
# nanocosmos-4B.yaml  --  resolution-ladder super-resolution + segmentation
# =====================================================================
# The 4B sibling of nanocosmos-16B.yaml: same joint recipe / data / loss,
# but the backbone is Cosmos3-Edge (variant EDGE) instead of the full
# Cosmos-3 Nano (16B).  Edge usually allows a larger patch/batch than Nano.
# Edge is loaded DIRECTLY from its own released
# checkpoint (nvidia/Cosmos3-Edge); a small, fixed set of parameters that
# checkpoint doesn't ship (a checkpoint/diffusers architecture gap, not a
# training gap) is filled from Nano by depth-remap + truncation --
# see `fill_missing_from_parent` in
# nanocosmos/models/cosmos_3_common/reduce.py and the "WHY SOME WEIGHTS ARE
# MISSING" note in nanocosmos/models/cosmos_3_edge/variants.py. Edge shares
# Nano's Wan2.2-TI2V VAE (same 16x-xy / 4x-z compression, same DiT token
# grid) but ~4x fewer transformer params, so it usually fits with a
# comparable or larger batch than the 16B recipe.
#
# The nanoCosmos recipe (see doc/RESOLUTION_LADDER.md + doc/JOINT_TRAINING.md):
# ONE Cosmos3-Edge (4B) backbone predicts on a fixed FINE grid (4 nm, 400x256x256) a
# single head that is the reconstructed fine EM (raw) AND the fine-grid
# segmentation (aff + sem).  EVERY supervision term pools the fine prediction
# down to wherever its ground truth lives (factor read from the GT shape).
# Two branches (roles STACK by dataset), routed per task-homogeneous batch by
# Joint3DReconSegLoss:
#
#   ssl   self-supervised reconstruction (gated by VOXEL SIZE): degrade the
#          smallest-voxel data -> reconstruct clean EM.  Sources: COSEM 4 nm
#          (small voxel) + unlabeled FlyEM (FIB-25/Hemibrain/MaleCNS) + CREMI
#          padded + MitoEM2 (image-only mito EM).  Label-free.
#   sft    segmentation (gated by LABELS): any labeled rung; pool the small-voxel
#          head to the label grid -> AffinityFGLoss.  Each labeled volume sets
#          ``label_convention`` (equal-length tokens):
#            gapped -- membranes / extracellular already label==0
#                      (Neurons, H01, SNEMI train val)
#            filled -- space-filling / abutting instances; sem gaps come from
#                      find_boundaries (FIB-25, CREMI, FlyWire, MICrONS)
#          FIB is both ssl+sft (labeled small-voxel rung).
# Convention: small voxel size = fine (4 nm); large voxel size = coarse (30-40 nm).
# Fine grid = 4 nm (smallest voxel; COSEM mip0, finest xy across all sets).  No
# RandResolutionZoom -- fixed resolution per volume; the per-volume pool factor
# is the only "resampling" and it is derived from the native label shape.
#
# Text condition (Cosmos3-Edge): every volume sets ``imaging:`` and SFT volumes
# set ``label_convention:``.  The fixed prompt is
#   ``{imaging} · z{Z} y{Y} x{X} nm · {gapped|filled|ssl}``
# (SSL always uses the ``ssl`` tail).  Fed to the DiT understanding stream.
# ``freeze_understanding_stream: true`` freezes the whole text encoder
# (embed_tokens + understanding attn/norms + mlp.*); the prompt still conditions
# because the vision stream keeps training and attends to the static text KV.
#
# Implemented + tested end-to-end: multi-task datamodule
# (nanocosmos/datamodules/joint3d.py), Lightning module
# (nanocosmos/modules/joint3d.py), joint loss (nanocosmos/losses/joint3d.py),
# and degradation transform (nanocosmos/transforms/degrade.py).  See
# tests/test_joint*.py.
# =====================================================================

experiment_name: nanocosmos-4B
project_name: nanocosmos
seed: 42
logger: tensorboard
ckpt_path: null
ckpt_path_skip_prefixes: []
ckpt_path_only_prefixes: null

data:
  dataset: joint3d        # -> Joint3DDataModule (multi-task round-robin)
  # Fixed FINE network grid: 4 nm voxel.  patch_size is (z, y, x) on that grid.
  # 400 x 256 x 256 @ 4 nm = 1.6 x 1.02 x 1.02 um FOV; z-heavy on purpose (z is the
  # super-resolution axis).  Cosmos3-Edge shares Nano's Wan2.2 VAE (4x in z, 16x
  # in xy) plus the latent_patch_size 2->1 repatch, so the DiT token grid is the
  # full latent grid (400/4, 256/16, 256/16) = (100, 16, 16) = 25,600 tokens --
  # 2x the 16B recipe's z-depth (200 -> 50) because this patch is z=400 vs 200.
  # Edge trims transformer depth/width (not the VAE/token grid) and has ~4x fewer
  # params than Nano, which is why it can afford the deeper patch; but self-
  # attention is quadratic in token count, so drop the patch (e.g. 200x256x256,
  # matching 16B, or 160x256x256) if it OOMs.
  patch_size: [400, 256, 256]
  pixel_size: [4, 4, 4]          # fine grid spacing (z, y, x) nm
  # No resolution jitter (clean recipe); the only resampling is the per-volume
  # pool to the native label grid, derived from the label shape.
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 8
  # Applied only to sft volumes with label_convention: filled (or unset).
  # gapped volumes already have membrane/extracellular as label==0, so
  # FindBoundariesd is skipped for those groups.
  find_boundaries: 1.0
  boundary_target: semantic
  # sft crop gate: require BOTH the labeled-foreground fraction AND the non-zero
  # EM fraction >= this value, so background-heavy / unlabeled crops and
  # zero-padded EM are rejected (best-seen crop kept after max retries).
  sft_min_foreground: 0.7
  # Instance-diversity gate: sft_min_foreground only checks the label's NON-ZERO
  # fraction, so a crop entirely filled by ONE giant instance (e.g. a single
  # dendrite trunk spanning the whole patch) passes trivially yet gives
  # AffinityFGLoss no inter-instance "push" signal -- only "pull".  Require >=2
  # distinct instances per crop (median counts are typically 20-125, so retries
  # are cheap) and cap the largest instance at 90% of foreground as a secondary
  # net.  0 = disabled.
  sft_min_instances: 2
  sft_max_inst_frac: 0.7
  # Reject mostly-empty / zero-padded ssl crops (image-nonzero gate) so the
  # SSL branch never trains/visualizes black patches.  Label-less ssl volumes only.
  ssl_min_foreground: 0.7
  # Contrast gate: reject flat, structureless ssl crops (e.g. resin / embedding
  # medium around a COSEM cell) whose normalised intensity std is below this
  # value.  The non-zero gate above cannot catch these (resin is a non-zero
  # mid-grey); only a variance test does.  Measured on the per-volume [0,1]
  # scale.  Tune up if low-content crops still appear, down if the foreground
  # retry budget is exhausted (best-seen fallback warns in the log).  0 = off.
  ssl_min_std: 0.05
  # Structure gate: reject NOISE-dominated ssl crops (detector / resin grain,
  # e.g. COSEM regions of embedding medium around the cell).  The variance gate
  # above CANNOT catch these -- random grain has high local std, so it passes
  # ssl_min_std with content_frac 1.0.  This is the lag-1 spatial
  # autocorrelation on the per-volume [0,1] scale: real ultrastructure is
  # spatially coherent (~0.6-0.8), white noise ~0.  Calibrated on jrc_hela-3
  # crops: noise crops sit at ~0.25, structured crops at ~0.7, so 0.5 cleanly
  # separates.  Tune down if the foreground-retry budget is exhausted.  0 = off.
  ssl_min_autocorr: 0.5
  # Round-robin grouping/scheduling unit: each batch is drawn from one group.
  #   "resolution" -- one group per (task, native_resolution); within a group
  #                   volumes are picked voxel-count-weighted (big volumes win).
  #   "volume"     -- one group per volume, scheduled EQUALLY (x per-volume
  #                   sample_weight); every batch is drawn from a single volume.
  #   "subset"     -- one group per domain, scheduled equally (x subset_weights).
  # Weights are relative ratios (normalised per branch), so the virtual-epoch
  # length stays fixed regardless of how they are set.
  balance: volume

  # ---- realistic large-voxel degradation for the SSL branch ----
  # (nanocosmos.transforms.RandResolutionDegraded) -- the free
  # large-voxel -> small-voxel pair.
  degrade:
    # Simulated section thickness zf = large_voxel_z / fine(4 nm).  Spans 8 nm (FIB)
    # .. 40 nm (CREMI/MICrONS) sections, i.e. zf 2 .. 10, log-uniform.
    zf_range: [2.0, 10.0]
    jitter_prob: 0.5            # per-section in-plane misalignment (grid_sample)
    max_jitter: 2.0             # +/- voxels
    missing_prob: 0.3           # missing / duplicated sections
    max_missing: 2
    missing_fill: zero
    noise_prob: 0.3             # section-dependent gaussian noise (gentled)
    noise_std: 0.01
    contrast_prob: 0.5          # section-dependent gamma jitter
    contrast_gamma: [0.8, 1.25]
    up_mode: nearest            # physically-faithful blocky z step (see RandResolutionDegraded docstring)

  # ---- the resolution ladder, as two task branches; the multi-task sampler
  # yields task-homogeneous batches and interleaves them round-robin
  # (sample_weight tunes the mix).  Each volume declares its NATIVE resolution
  # (z, y, x nm); the datamodule resamples the image onto the 4 nm fine grid
  # for the network input and keeps the labels on their native grid, so the
  # loss pool factor = native/fine is derived from the label shape. ----
  branches:
    ssl:
      task: ssl
      batch_size: 3
      sample_weight: 1.0
      # Smallest-voxel rung: COSEM ~4 nm (image-only; organelle labels unused),
      # PLUS unlabeled FIB-25 / Hemibrain / MaleCNS neuropil and CREMI padded
      # volumes -- domain-matched EM that reconstructs for free.
      # RandResolutionDegraded synthesises the (degraded -> clean) pair.  Add
      # OpenOrganelle volumes here to scale SSL toward petascale.
      volumes:
      # --- COSEM ~4 nm small voxel (exact z per volume), all tiles ---
      # jrc_hela-3 x0_y0_z0 / x0_y0_z8192 REMOVED: audited as mostly embedding
      # RESIN (median lag-1 autocorr ~0.26-0.27 -- ~white noise) around the
      # HeLa cell edge; passed the old ssl_min_std gate trivially (noise has
      # high local variance) but fails ssl_min_autocorr.  Replaced with 2
      # verified-structured tiles found via scripts/collect_meaningful_crops.py
      # (probe-and-rank against the SAME content_frac + autocorr gates); see
      # doc/DATASETS.md#ssl-crop-cleaning-content--structure-gates.
      # Baked to true 4 nm cubic via scripts/resample_cosem_isotropic.py (z-only
      # trilinear, e.g. 3.24 -> 4 nm) -- see doc/RESOLUTION_LADDER.md #2.1 and the
      # "for all <4nm, treat as ~4nm?" discussion: the datamodule already clamps
      # the RECON TARGET resolution to max(native, 4nm) at train time, but that
      # does NOT change the native crop READ size, so relabeling native_resolution
      # here without actually resampling the files would silently shrink the read
      # FOV and skip the image resample -- these are genuinely-resampled files, so
      # native_resolution: [4,4,4] is now truthful, not a pseudo/declared value.
      - vol: jrc_hela-3_4nm_x4096_y0_z2048_volume   # autocorr 0.72
        root: data/COSEM3D
        native_resolution: [4, 4, 4]
        imaging: FIB-SEM
      - vol: jrc_hela-3_4nm_x6144_y0_z2048_volume   # autocorr 0.63
        root: data/COSEM3D
        native_resolution: [4, 4, 4]
        imaging: FIB-SEM
      - vol: jrc_hela-3_4nm_x4096_y0_z0_volume
        root: data/COSEM3D
        native_resolution: [4, 4, 4]
        imaging: FIB-SEM
      - vol: jrc_hela-3_4nm_x4096_y0_z4096_volume
        root: data/COSEM3D
        native_resolution: [4, 4, 4]
        imaging: FIB-SEM
      - vol: jrc_hela-3_4nm_x2048_y0_z4096_volume   # autocorr 0.75
        root: data/COSEM3D
        native_resolution: [4, 4, 4]
        imaging: FIB-SEM
      - vol: jrc_macrophage-2_4nm_x4096_y0_z4096_volume
        root: data/COSEM3D
        native_resolution: [4, 4, 4]
        imaging: FIB-SEM
      - vol: jrc_jurkat-1_4nm_x4096_y0_z0_volume
        root: data/COSEM3D
        native_resolution: [4, 4, 4]
        imaging: FIB-SEM
      - vol: jrc_jurkat-1_4nm_x4096_y0_z4096_volume
        root: data/COSEM3D
        native_resolution: [4, 4, 4]
        imaging: FIB-SEM
      # --- FLYEM3D 8 nm neuropil, IMAGE-ONLY (FIB-25 out-of-core surround) ---
      # 4 train crops per source (1 more held out per source in val_volumes);
      # all verified non-empty (empty corner tiles dropped).
      - vol: flyem3d_8nm_ssl_x2700_y2700_z3500_volume
        root: data/FLYEM3D
        native_resolution: [8, 8, 8]
        imaging: FIB-SEM
      - vol: flyem3d_8nm_ssl_x3000_y3000_z5000_volume
        root: data/FLYEM3D
        native_resolution: [8, 8, 8]
        imaging: FIB-SEM
      # --- Hemibrain 8 nm neuropil, image-only ---
      - vol: flyem3d_hemibrain_8nm_ssl_x12000_y12000_z12000_volume
        root: data/FLYEM3D
        native_resolution: [8, 8, 8]
        imaging: FIB-SEM
      - vol: flyem3d_hemibrain_8nm_ssl_x16000_y30000_z36000_volume
        root: data/FLYEM3D
        native_resolution: [8, 8, 8]
        imaging: FIB-SEM
      - vol: flyem3d_hemibrain_8nm_ssl_x20000_y20000_z20000_volume
        root: data/FLYEM3D
        native_resolution: [8, 8, 8]
        imaging: FIB-SEM
      - vol: flyem3d_hemibrain_8nm_ssl_x24000_y24000_z24000_volume
        root: data/FLYEM3D
        native_resolution: [8, 8, 8]
        imaging: FIB-SEM
      # --- MaleCNS 8 nm neuropil, image-only ---
      - vol: flyem3d_malecns_8nm_ssl_x16000_y30000_z36000_volume
        root: data/FLYEM3D
        native_resolution: [8, 8, 8]
        imaging: FIB-SEM
      # x20000_y20000_z20000 REMOVED: audited autocorr ~0.45 (borderline
      # low vs the ~0.85-0.95 the rest of this bucket shows). Replaced with a
      # verified-structured tile (autocorr 0.94) found via
      # scripts/collect_meaningful_crops.py.
      - vol: flyem3d_malecns_8nm_ssl_x18000_y18000_z30000_volume   # autocorr 0.94
        root: data/FLYEM3D
        native_resolution: [8, 8, 8]
        imaging: FIB-SEM
      - vol: flyem3d_malecns_8nm_ssl_x28000_y24000_z30000_volume
        root: data/FLYEM3D
        native_resolution: [8, 8, 8]
        imaging: FIB-SEM
      - vol: flyem3d_malecns_8nm_ssl_x24000_y24000_z24000_volume
        root: data/FLYEM3D
        native_resolution: [8, 8, 8]
        imaging: FIB-SEM
      # --- CREMI 40x4x4 PADDED test volumes, IMAGE-ONLY (no public labels) ---
      # Switched Jul 2026 from the CROPPED (151 MB, 125x1250x1250) test
      # download to the official PADDED (1.46 GB, 200x3072x3072) download --
      # same tissue, ~4x more context/voxels per sample, so more free SSL
      # signal from the exact same three challenge test volumes. Verified by
      # exact full-volume array match: the cropped volume sits at native-voxel
      # offset (z=37, y=911, x=911) inside the padded one, identically for all
      # three samples -- see doc/DATASETS.md#cremi-padded-vs-cropped-test-volumes.
      - vol: cremi3d_sample_A+_padded_volume
        root: data/CREMI3D
        native_resolution: [40, 4, 4]
        imaging: ssTEM
      - vol: cremi3d_sample_B+_padded_volume
        root: data/CREMI3D
        native_resolution: [40, 4, 4]
        imaging: ssTEM
      - vol: cremi3d_sample_C+_padded_volume
        root: data/CREMI3D
        native_resolution: [40, 4, 4]
        imaging: ssTEM
      # --- SNEMI3D test volume, IMAGE-ONLY (labels never publicly released) ---
      - vol: test_inputs
        root: data/SNEMI3D
        native_resolution: [30, 6, 6]
        imaging: ssSEM
      # --- MitoEM2 mitochondria EM, IMAGE-ONLY (nnU-Net .nii.gz -> *_volume.h5) ---
      # Refreshed Jul 2026 from MitoEM 2.0 v6 (Zenodo 10.5281/zenodo.20417683);
      # see doc/DATASETS.md#mitoem2-refresh-from-zenodo-v6-jul-2026.
      # NOTE: Dataset001_ME2-Beta's NIfTI headers ship voxel spacing (1,1,1)
      # (an upstream metadata bug -- Jurkat/Macro/Podo/Sperm/Mossy/Pyra headers
      # are correct); native_resolution below is the metadata.csv-documented
      # 16 nm, NOT what convert_mitoem2.py would auto-derive from the header.
      # 16 nm iso: Beta/Jurkat/Macro/Podo/Sperm
      - vol: mitoem2_beta_train01_volume
        root: data/MitoEM2
        native_resolution: [16, 16, 16]
        imaging: FIB-SEM
      - vol: mitoem2_beta_train02_volume
        root: data/MitoEM2
        native_resolution: [16, 16, 16]
        imaging: FIB-SEM
      - vol: mitoem2_beta_train03_volume
        root: data/MitoEM2
        native_resolution: [16, 16, 16]
        imaging: FIB-SEM
      - vol: mitoem2_beta_train04_volume
        root: data/MitoEM2
        native_resolution: [16, 16, 16]
        imaging: FIB-SEM
      # jurkat_train01 / macro_train01 RESTORED: an older doc note said these
      # were "removed as empty", but audited fresh against the current
      # release they are genuine, good EM (autocorr 0.79 / 0.59) -- whatever
      # was wrong with them upstream previously appears to have been fixed.
      - vol: mitoem2_jurkat_train01_volume   # autocorr 0.79
        root: data/MitoEM2
        native_resolution: [16, 16, 16]
        imaging: FIB-SEM
      - vol: mitoem2_macro_train01_volume   # autocorr 0.59
        root: data/MitoEM2
        native_resolution: [16, 16, 16]
        imaging: FIB-SEM
      # mitoem2_jurkat_train02 / mitoem2_macro_train02 REMOVED: audited as pure
      # uniform random noise (min=0, max=255, all 256 values present, std~73.9 =
      # theoretical max). CONFIRMED PERSISTENT in the fresh Zenodo v6 release
      # too (re-downloaded + checksum-verified against the official
      # checksums.txt -- these two files are the ONLY ones in the whole
      # release that FAIL verification) -- a genuine upstream MitoEM2
      # packaging bug, not a conversion artifact. Passed the old
      # ssl_min_std/foreground gates trivially (noise has high variance) but
      # fails ssl_min_autocorr (~0.0 vs ~0.6-0.9 for real EM); see
      # doc/DATASETS.md#ssl-crop-cleaning-content--structure-gates.
      - vol: mitoem2_podo_train01_volume
        root: data/MitoEM2
        native_resolution: [16, 16, 16]
        imaging: FIB-SEM
      - vol: mitoem2_podo_train02_volume
        root: data/MitoEM2
        native_resolution: [16, 16, 16]
        imaging: FIB-SEM
      - vol: mitoem2_sperm_train01_volume
        root: data/MitoEM2
        native_resolution: [16, 16, 16]
        imaging: FIB-SEM
      - vol: mitoem2_sperm_train02_volume
        root: data/MitoEM2
        native_resolution: [16, 16, 16]
        imaging: FIB-SEM
      # 8 nm xy / 30 nm z: Mossy/Pyra/Stem
      - vol: mitoem2_mossy_train01_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_mossy_train02_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_mossy_train03_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train01_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train02_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train03_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train04_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train05_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train06_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train07_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train08_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train09_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train10_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train11_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train12_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train13_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train14_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train15_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train16_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      - vol: mitoem2_pyra_train17_volume
        root: data/MitoEM2
        native_resolution: [30, 8, 8]
        imaging: FIB-SEM
      # mitoem2_stem_train01 / mitoem2_stem_train02 REMOVED: audited as
      # consistently low-structure (25-probe autocorr: train01 max=0.49
      # median=0.40, ZERO probes reach the 0.5 gate threshold; train02
      # max=0.49 median=0.44, also 0/25) -- unlike the heterogeneous jrc_hela-3
      # tiles, there is no good sub-region within these files for the per-crop
      # ssl_min_autocorr gate to land on.  No CloudVolume source for MitoEM2
      # (local nnU-Net conversion only), so "ignore in config" is the only fix;
      # see doc/DATASETS.md#ssl-crop-cleaning-content--structure-gates.
    sft:
      task: sft
      batch_size: 3
      sample_weight: 2.0
      # Labeled rungs tagged with label_convention: gapped | filled.
      # Predict at 4 nm, pool the head to the native label grid, then
      # AffinityFGLoss.  MICrONS is filled (auto-seg); SNEMI/Neurons/H01
      # are gapped -- grouping + text tail isolate the conventions.
      volumes:
      - vol: flyem3d_8nm_x2304_y2048_z6144_volume          # FIB-25 8 nm, labeled
        seg: flyem3d_8nm_x2304_y2048_z6144_segmentation
        root: data/FLYEM3D
        native_resolution: [8, 8, 8]
        imaging: FIB-SEM
        label_convention: filled
      - vol: neurons_5000x2900x300_x3000_y7200_z950_volume # SNEMI3D 30x6x6
        seg: neurons_5000x2900x300_x3000_y7200_z950_segmentation
        root: data/SNEMI3D
        native_resolution: [30, 6, 6]
        imaging: ssSEM
        label_convention: gapped
      - vol: cremi3d_sample_A_volume                       # CREMI 40x4x4
        seg: cremi3d_sample_A_segmentation
        root: data/CREMI3D
        native_resolution: [40, 4, 4]
        imaging: ssTEM
        label_convention: filled
      - vol: cremi3d_sample_B_volume
        seg: cremi3d_sample_B_segmentation
        root: data/CREMI3D
        native_resolution: [40, 4, 4]
        imaging: ssTEM
