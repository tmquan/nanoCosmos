  # replace it with, and no train counterpart left to pair it with anyway.

model:
  type: joint3d_edge     # -> JointEdge3DModule (Cosmos3-Edge ~4B backbone, direct-loaded + Nano-filled gaps, + Joint3DReconSegLoss)
  variant: EDGE
  in_channels: 1
  head_channels: 32            # len(loss.seg.offsets)=30 + sem + raw
  feature_size: 64
  dropout: 0.0                 # no dropout anywhere in the Cosmos3 model (matches 16B)
  pretrained: true
  dtype: bf16
  # FP8 (Blackwell B300) on the generation-stream DiT Linears via torchao
  # rowwise.  Only the token-parallel vision matmuls (add_*/to_add_out/
  # mlp_moe_gen) are converted; the frozen understanding stream, norms,
  # embeds, proj_in/out and heads stay BF16 (see models/cosmos_2_5_common/
  # fp8.py).  Decoupled from ``precision: bf16-true``; graceful BF16 fallback
  # if torchao is unavailable.  Fresh-run setting (changes numerics).
  fp8: true
  fp8_recipe: rowwise
  freeze_vae_encoder: true
  # Cosmos 3 MoT warm-up.  ``freeze_dit_backbone`` freezes/thaws the WHOLE
  # DiT on a schedule (independent of freeze_understanding_ffn below):
  #   epochs 0..4 : the WHOLE DiT is frozen (cheap warm-up, as usual).
  #   epoch 5+    : thaws the whole DiT (subject to the permanent
  #                 understanding-FFN hold-out below).
  #   false -> whole DiT trains from epoch 0 (no warm-up freeze at all).
  #   true  -> whole DiT frozen for the entire run (no thaw).
  freeze_dit_backbone: 5
  # Understanding (text) pathway hold-outs, INDEPENDENT of the
  # freeze_dit_backbone schedule.  The Cosmos3 MoT has SEPARATE weights per
  # stream and the text stream is causal + vision-independent, so freezing it
  # does NOT touch the vision stream.
  #   freeze_understanding_ffn:    freeze only mlp.* (~36% of the DiT).
  #   freeze_understanding_stream: freeze the WHOLE text encoder -- embed_tokens
  #                                + understanding attn (to_q/k/v/out, norm_q/k)
  #                                + understanding norms + mlp.* (SUPERSET; when
  #                                true the ffn flag is redundant).
  # We freeze the whole stream: with a fixed tiny prompt vocabulary the prompt
  # still conditions fully because the generation (vision) stream keeps training
  # and learns to attend to the now-static text keys/values (a standard frozen
  # text encoder).  This also reclaims the text encoder's optimizer/grad memory
  # (notably the large embed_tokens table).  Flip both to false only for
  # richer/free-form captions or when memory is ample.
  freeze_understanding_ffn: false
  freeze_understanding_stream: true
  freeze_vae_decoder: true
  # ["decode"]: keep ONLY the mandatory per-frame Wan VAE-decode recompute;
  # run the DiT + head WITHOUT recompute for speed.  FP8 above frees the
  # vision-Linear activation memory that full checkpointing used to pay for.
  # NOTE: any checkpointing is incompatible with torch.compile tracing the
  # checkpoint HOP -- if compile is on, it must skip/scope around the decode.
  gradient_checkpointing: ["dit", "decode"]
  vae_input_pm1: true
  vae_symmetrize_z: true  # non-causal z: avg(forward, z-flipped) encode; see GOTCHAS #48

optimizer:
  lr: 0.0002
  weight_decay: 0.0001
  betas: [0.9, 0.99]
  scheduler:
    type: cosine_warmup
    T_max: 101
    eta_min: 6.0e-05
    warmup_epochs: 5
  dit_backbone_lr: 1.0e-04

# Joint3DReconSegLoss: branch weights + the inner segmentation (AffinityFGLoss)
# config.  ``weight_raw`` of the inner loss is forced to 0 -- the EM
# reconstruction term is owned by the joint loss (``weight_rec``) so it can
# target the clean EM and skip / switch grids per branch.
loss:
  type: joint3d
  recon_loss: l1
  weight_rec: 1.0
  weight_seg: 1.0
  # Per-branch multipliers (independent of draw frequency). The SSL recon
  # branch is weighted 10x the SFT seg branch (matches the shipped checkpoint).
  weight_ssl: 5.0
  weight_sft: 1.0
  seg:
    ignore_index: -100
    background: -1
    n_pull: 5
    offsets:
    - [-1, 0, 0]
    - [0, -1, 0]
    - [0, 0, -1]
    - [0, -1, -1]
    - [0, 1, -1]
    - [-2, 0, 0]
    - [-3, 0, 0]
    - [-4, 0, 0]
    - [-5, 0, 0]
    - [-8, 0, 0]
    - [0, -2, 0]
    - [0, 0, -2]
    - [0, -4, 0]
    - [0, 0, -4]
    - [0, -8, 0]
    - [0, 0, -8]
    - [0, -16, 0]
    - [0, 0, -16]
    - [0, -32, 0]
    - [0, 0, -32]
    - [0, -2, -2]
    - [0, 2, -2]
    - [0, -4, -4]
    - [0, 4, -4]
    - [0, -8, -8]
    - [0, 8, -8]
    - [0, -16, -16]
    - [0, 16, -16]
    - [0, -32, -32]
    - [0, 32, -32]
    weight_aff:
      weight: 1.0
      lambda_bce: 1.0
      lambda_dice: 1.0
      lambda_focal: 1.0
      gamma: 3.0
      pull_weight: 1.0
      push_weight: 3.0
      mask_to_foreground: true
      class_balance: auto
      class_balance_clip: 10.0
      dice_two_sided: true
    weight_sem:
      weight: 1.0
      lambda_bce: 1.0
      lambda_dice: 1.0
      lambda_focal: 1.0
      gamma: 3.0
      class_balance: auto
      class_balance_clip: 10.0
      dice_two_sided: true

training:
  mutex_watershed:
    strides: [1, 1, 1]
    size_filter: 50
    backend: auto
    buckets: 16
    max_push_edges: null
    gate_with_sem: true
    sem_gate_threshold: 0.5
    grow_boundaries: true
    grow_max_distance: 4.0
  max_epochs: 101
  accelerator: auto
  devices: auto
  strategy: ddp
  # Joint datamodule uses a custom round-robin batch_sampler -> Lightning
  # cannot auto-inject a DistributedSampler; the sampler + random per-item
  # patch sampling handle per-rank data spread instead.
  use_distributed_sampler: false
  precision: bf16-true
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 1.0
  # Cap the (otherwise ~52k = 6.5 x num_samples) round-robin schedule to a sane
  # epoch length.  The shuffled schedule makes each epoch a task-weighted random
  # subset that rotates -- raise/lower to trade epoch length for checkpoint/val
  # frequency.
  limit_train_batches: 500
  limit_val_batches: 100
  check_val_every_n_epoch: 10
  num_sanity_val_steps: 2
  log_every_n_steps: 100
  enable_progress_bar: true
  enable_model_summary: true
  deterministic: false
  benchmark: true
  # Off: incompatible with gradient_checkpointing (dynamo can't trace the
  # torch.utils.checkpoint HOP), and reduce-overhead cudagraphs fragment memory.
  compile: false 
  compile_fullgraph: false 
  fast_dev_run: false
  profiler: null
  resume_from_checkpoint: null

callbacks:
  checkpoint:
    enabled: true
    dirpath: null
    filename: '{epoch:02d}-{val/automatic/loss:.4f}'
    save_top_k: 3
    monitor: val/automatic/loss
    mode: min
    save_last: true
    verbose: true
  early_stopping:
    enabled: false
  lr_monitor:
    enabled: true
  image_logger:
    enabled: true
    every_n_epochs: 1
    max_images: 8
  cuda_empty_cache_before_val: true
  memory_logger:
    enabled: true
    log_every_n_steps: null

output_dir: outputs
